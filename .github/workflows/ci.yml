name: Denaro CI

on:
  push:
    branches: [main, Prod-V1]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install ruff
      - run: ruff check . --ignore=E501,E731 --exclude=_archive,venv,__pycache__,.ruff_cache

  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pytest websockets ccxt
      - run: PYTHONPATH=. python -m pytest test_denaro_core.py test_kraken_engine.py -v --tb=short

  mock-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install websockets ccxt pytest
      - run: PYTHONPATH=. MOCK_MODE=1 python -c "
from mock_runner import run_mock_test
r = run_mock_test(cycles=50, verbose=False)
print(f'Trades: {r[\"total_trades\"]}, WinRate: {r[\"win_rate\"]*100:.0f}%, PnL: {r[\"final_pnl_pct\"]:+.2f}%')
assert r['total_trades'] > 3, f'Too few trades: {r[\"total_trades\"]}'
"
