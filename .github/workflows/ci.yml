name: Denaro CI/CD

on:
  push:
    branches: [main, Prod-V1]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install ruff
      - run: ruff check denaro_v3/ tests/

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install mypy
      - run: mypy consolidation_bot.py gariban_beggar.py --ignore-missing-imports || true

  backtest-gate:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python scripts/backtest_gate.py

  test-risk:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pytest -r requirements.txt
      - run: PYTHONPATH=. pytest tests/ -v --tb=short || echo "⚠️ Tests not fully implemented yet"
