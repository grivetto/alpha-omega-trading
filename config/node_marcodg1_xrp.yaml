# Denaro — nodo TRADING su MARCODG1
#
# Cambio di strategia 2026-09-17: da strategia senza alpha misurato a TREND
# GIORNALIERO. Su 19 asset e 36 set di parametri FISSI l'alpha e' positivo in 36
# casi su 36 (mediano +19.99%, t mediano +2.24) e sopravvive alla fee taker.
# Documentato in docs/17_risultato_ricerca_2026-09-17.md.
#
# Gli asset sono DIVERSI fra i tre conti: mc2 (BTC ETH SOL XRP DOGE), qui
# (ADA ATOM AAVE ARB XLM). Insieme i tre conti coprono 15 asset senza
# sovrapposizioni: la flotta e' un portafoglio diversificato, non tre volte la
# stessa scommessa.

data_dir: node_data_xrp
overrides_file: config/nessun_override.json
supervisor:
  ram_critical_pct: 0.85
  ram_throttle_pct: 0.70
  cpu_critical_pct: 0.90
  tick_max_factor: 5.0
safemode:
  caution_pct: 70.0
  safe_pct: 85.0
  emergency_pct: 95.0
  interval_s: 10.0
hub:
  ws_enabled: false
  poll_interval: 10
  price_ttl: 30
exchange_rest:
  name: okx
  eea: true
rate_limits:
  okx:
    capacity: 10.0
    refill_rate: 5.0
