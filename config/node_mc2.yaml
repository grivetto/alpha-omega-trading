# DENARO — istanza LIVE su MC2 (OKX mc2sub1: DOGE/EUR + SOL/EUR)
data_dir: node_data
supervisor:
  ram_critical_pct: 0.85
  ram_throttle_pct: 0.70
  cpu_critical_pct: 0.90
  tick_max_factor: 5.0
safemode:
  caution_pct: 70.0
  safe_pct: 85.0
  emergency_pct: 95.0
  interval_s: 10.0
hub:
  ws_enabled: true
  poll_interval: 10
  price_ttl: 30
  ws_max_retries: 5
  ws_retry_base_s: 2.0
exchange_rest:
  name: okx
  eea: true
bots:
  # ── BOT LIVE 1: OKX DOGE/EUR (Capitale: 12.00 €) ──
  - symbol: DOGE/EUR
    mode: okx
    capital: 12.0
    levels: 3
    buy_distance: 0.015
    profit_target: 0.02
    fee: 0.001
    tick_interval: 30
    env_prefix: ''
    health_path: /home/sergio/denaro/health/doge_mc2.json
    stop_loss_pct: 0.10
    daily_loss_limit: 0.05
    max_drawdown_limit: 0.15
    sell_levels: 2
    sell_distance: 0.02
    sell_step: 0.01
    min_notional: 1.0
    enabled: true

  # ── BOT LIVE 2: OKX SOL/EUR (Capitale: 12.00 €) ──
  - symbol: SOL/EUR
    mode: okx
    capital: 12.0
    levels: 3
    buy_distance: 0.015
    profit_target: 0.02
    fee: 0.001
    tick_interval: 30
    env_prefix: ''
    health_path: /home/sergio/denaro/health/sol_mc2.json
    stop_loss_pct: 0.10
    daily_loss_limit: 0.05
    max_drawdown_limit: 0.15
    sell_levels: 2
    sell_distance: 0.02
    sell_step: 0.01
    min_notional: 1.0
    enabled: true
