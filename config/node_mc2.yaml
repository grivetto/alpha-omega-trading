# DENARO — istanza LIVE su MC2 (OKX mc2sub1) — TREND GIORNALIERO
#
# Cambio di strategia 2026-09-17. Prima: griglia su DOGE/EUR, con alpha di
# Jensen NEGATIVO e statisticamente solido (-7.48%, t = -4.64 su 18
# osservazioni) e negativo ANCHE a fee zero: non erano le commissioni, la
# griglia non aveva segnale.
#
# Ora: trend following GIORNALIERO su 5 asset, un bot per asset, capitale
# ripartito. Motivo: su 19 asset e 36 set di parametri FISSI l'alpha e' positivo
# in 36 casi su 36 (mediano +19.99%, t mediano +2.24) e sopravvive alla fee
# taker; il leave-one-out non crolla. La misura e' documentata in
# docs/17_risultato_ricerca_2026-09-17.md (sezione 11).
#
# Un bot per asset e non uno solo perche' l'edge misurato e' di PORTAFOGLIO:
# il rendimento atteso e' la media dei 19 asset, non quello di un singolo.
data_dir: node_data
supervisor:
  ram_critical_pct: 0.85
  ram_throttle_pct: 0.70
  cpu_critical_pct: 0.90
  tick_max_factor: 5.0
safemode:
  caution_pct: 70.0
  safe_pct: 85.0
  emergency_pct: 95.0
  interval_s: 10.0
hub:
  ws_enabled: true
  poll_interval: 10
  price_ttl: 30
  ws_max_retries: 5
  ws_retry_base_s: 2.0
exchange_rest:
  name: okx
  eea: true
bots:
  # ── parametri IDENTICI per tutti: un solo set, nessuna selezione ──
  # canale 40 / trail 3 ATR / stop 2 ATR / media 100 / rischio 2% per trade
  - symbol: BTC/EUR
    mode: okx
    strategy: trend
    capital: 5.0
    canale: 40
    atr_period: 14
    trail_mult: 3.0
    stop_atr_mult: 2.0
    trend_ema: 100
    risk_pct: 0.02
    fee: 0.002
    tick_interval: 30
    env_prefix: ''
    health_path: /home/sergio/denaro/health/btc_mc2.json
    stop_loss_pct: 0.15
    daily_loss_limit: 0.05
    max_drawdown_limit: 0.20
    min_notional: 1.0
    enabled: true

