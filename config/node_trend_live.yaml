# DENARO — istanza TREND LIVE (template, NON attivo finche' il sub-account
# trendsub1 non esiste e la validazione paper 24h non conferma).
# Abilita quando: (1) sub-account OKX "trendsub1" creato (console o API),
# (2) chiavi nel .env con prefisso TRENDSUB1_, (3) funding EUR dal main.
# Regola: mai due engine sullo stesso account — il trend live va SOLO qui.
data_dir: node_data_trend_live
overrides_file: config/strategy_overrides_trend_live.json
supervisor:
  ram_critical_pct: 0.85
  ram_throttle_pct: 0.70
  cpu_critical_pct: 0.90
  tick_max_factor: 5.0
safemode:
  caution_pct: 70.0
  safe_pct: 85.0
  emergency_pct: 95.0
  interval_s: 10.0
hub:
  ws_enabled: true
  poll_interval: 10
  price_ttl: 30
  ws_max_retries: 5
  ws_retry_base_s: 2.0
exchange_rest:
  name: okx
  eea: true
bots:
  # ── MOMENTUM LIVE (sub-account dedicato) ──
  - symbol: SOL/EUR
    mode: okx
    capital: 10.0
    strategy: momentum
    profit_target: 0.025
    entry_slip: 0.002
    fee: 0.001
    tick_interval: 30
    env_prefix: TRENDSUB1_
    health_path: /home/marco/denaro/health/trend_sol.json
    stop_loss_pct: 0.10
    daily_loss_limit: 0.05
    max_drawdown_limit: 0.15
    enabled: false   # attivare solo dopo validazione paper + funding
