# Denaro Node — OFFICINA PAPER su MC2 (dal 2026-10-01)
# Stessi bot trend del node live, ma mode=paper: fill SIMULATI via PaperExchange
# (fee/slippage/mimizzano la realtà), NESSUN ordine, NESSUNA chiave.
# Serve a testare in forward sui prezzi live il set di strategie della flotta.
# Il node live resta installato ma disabilitato: si riaccende solo con capitale dedicato.

data_dir: node_data_paper
overrides_file: config/nessun_override.json
supervisor:
  ram_critical_pct: 0.85
  ram_throttle_pct: 0.7
  cpu_critical_pct: 0.9
  tick_max_factor: 5.0
safemode:
  caution_pct: 70.0
  safe_pct: 85.0
  emergency_pct: 95.0
  interval_s: 10.0
hub:
  ws_enabled: true
  poll_interval: 10
  price_ttl: 30
  ws_max_retries: 5
  ws_retry_base_s: 2.0
exchange_rest:
  name: okx
  eea: true
bots:
- symbol: BTC/EUR
  mode: paper
  strategy: trend
  capital: 25.0
  canale: 40
  atr_period: 14
  trail_mult: 2.5
  stop_atr_mult: 2.0
  trend_ema: 100
  risk_pct: 0.02
  fee: 0.0035
  tick_interval: 30
  health_path: /home/sergio/denaro/health/btc_mc2_paper.json
  stop_loss_pct: 0.15
  daily_loss_limit: 0.05
  max_drawdown_limit: 0.2
  min_notional: 1.0
  enabled: true
