# DENARO — config unificata del Node (tutti gli ambienti di trading).
# CUTOVER LIVE: i bot live OKX/Kraken sono attivi (v3.3 fermati).
# L'ex-ATLAS (Kraken ATLAS_) resta disabilitato (verifica prima, poi attivazione).
data_dir: node_data
supervisor:
  ram_critical_pct: 0.85
  ram_throttle_pct: 0.70
  cpu_critical_pct: 0.90
  tick_max_factor: 5.0
safemode:
  caution_pct: 70.0
  safe_pct: 85.0
  emergency_pct: 95.0
  interval_s: 10.0
hub:
  ws_enabled: true
  poll_interval: 10
  price_ttl: 30
  ws_max_retries: 5
  ws_retry_base_s: 2.0
exchange_rest:
  name: okx
  eea: true
bots:
  # ── PAPER (500€ virtuali — validazione parita') ──
  - symbol: ADA/EUR
    mode: paper
    capital: 300
    levels: 3
    buy_distance: 0.015
    profit_target: 0.02
    fee: 0.001
    tick_interval: 30
  - symbol: SOL/EUR
    mode: paper
    capital: 100
    levels: 3
    buy_distance: 0.01
    profit_target: 0.015
    fee: 0.001
    tick_interval: 30
  - symbol: XRP/EUR
    mode: paper
    capital: 100
    levels: 3
    buy_distance: 0.01
    profit_target: 0.015
    fee: 0.001
    tick_interval: 30

  # ── LIVE OKX (cutover attivo; health_path = path v3.3 per dashboard/Zabbix) ──
  - symbol: ADA/EUR
    mode: okx
    capital: 20.0
    levels: 3
    buy_distance: 0.001
    profit_target: 0.02
    fee: 0.001
    tick_interval: 30
    env_prefix: MARCOSUB1_
    health_path: /home/marco/denaro/health/ada.json
    enabled: true
  - symbol: SOL/EUR
    mode: okx
    capital: 5.0
    levels: 3
    buy_distance: 0.01
    profit_target: 0.015
    fee: 0.001
    tick_interval: 30
    env_prefix: ""
    health_path: /home/marco/denaro/health/sol.json
    enabled: true

  # ── LIVE KRAKEN (cutover attivo, ora locale nel Node su MARCODG1) ──
  - symbol: SOL/EUR
    mode: kraken
    capital: 25.0
    levels: 3
    buy_distance: 0.01
    profit_target: 0.015
    fee: 0.0026
    tick_interval: 30
    env_prefix: KRAKEN_
    health_path: /home/marco/denaro/health/sol_kraken.json
    enabled: true

  # ── KRAKEN ex-ATLAS (in attesa di verifica cutover) ──
  - symbol: SOL/EUR
    mode: kraken
    capital: 26.0
    levels: 3
    buy_distance: 0.008
    profit_target: 0.008
    fee: 0.0026
    tick_interval: 30
    env_prefix: ATLAS_
    enabled: false
