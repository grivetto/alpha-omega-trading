# fill SIMULATI (PaperExchange), NESSUN ordine, NESSUNA chiave.
data_dir: node_data_xrp_paper
overrides_file: config/nessun_override.json
supervisor:
  ram_critical_pct: 0.85
  ram_throttle_pct: 0.7
  cpu_critical_pct: 0.9
  tick_max_factor: 5.0
