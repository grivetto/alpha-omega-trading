  caution_pct: 70.0
  safe_pct: 85.0
  emergency_pct: 95.0
  interval_s: 10.0
hub:
  ws_enabled: false
  poll_interval: 10
  price_ttl: 30
exchange_rest:
  name: okx
  eea: true
rate_limits:
  okx:
    capacity: 10.0
    refill_rate: 5.0
bots:
