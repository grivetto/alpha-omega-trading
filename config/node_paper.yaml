# Denaro Node — config paper (M6/M7): stessi parametri dei paper live v3.3
# Caricata con denaro.application.config (YAML + Pydantic + interpolazione ${VAR})
data_dir: node_data
supervisor:
  ram_critical_pct: 0.85
  ram_throttle_pct: 0.70
  cpu_critical_pct: 0.90
  tick_max_factor: 5.0
safemode:
  caution_pct: 70.0
  safe_pct: 85.0
  emergency_pct: 95.0
  interval_s: 10.0
hub:
  ws_enabled: true
  poll_interval: 10
  price_ttl: 30
  ws_max_retries: 5
  ws_retry_base_s: 2.0
exchange_rest:
  name: okx
  eea: true
bots:
  - symbol: ADA/EUR
    mode: paper
    capital: 300
    levels: 3
    buy_distance: 0.015
    profit_target: 0.02
    fee: 0.001
    tick_interval: 30
  - symbol: SOL/EUR
    mode: paper
    capital: 100
    levels: 3
    buy_distance: 0.01
    profit_target: 0.015
    fee: 0.001
    tick_interval: 30
  - symbol: XRP/EUR
    mode: paper
    capital: 100
    levels: 3
    buy_distance: 0.01
    profit_target: 0.015
    fee: 0.001
    tick_interval: 30
