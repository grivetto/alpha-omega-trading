# DENARO — istanza TREND LIVE su KRAKEN (template, NON attivo).
# Abilita quando: (1) sub-account Kraken "trendsub" creato in console,
# (2) API key del sub-account nel .env con prefisso TRENDSUB_,
# (3) funding EUR dal conto Kraken principale (~52€ disponibili).
# Regola: mai due engine sullo stesso account — il trend live va SOLO qui.
data_dir: node_data_trend_live
overrides_file: config/strategy_overrides_trend_live.json
supervisor:
  ram_critical_pct: 0.85
  ram_throttle_pct: 0.70
  cpu_critical_pct: 0.90
  tick_max_factor: 5.0
safemode:
  caution_pct: 70.0
  safe_pct: 85.0
  emergency_pct: 95.0
  interval_s: 10.0
hub:
  ws_enabled: false          # Kraken WS non abilitato: polling REST ok
  poll_interval: 10
  price_ttl: 30
  ws_max_retries: 5
  ws_retry_base_s: 2.0
exchange_rest:
  name: okx
  eea: true
bots:
  # ── MOMENTUM LIVE su sub-account Kraken dedicato ──
  # Kraken: min SOL 0.06 (~5€), fee maker 0.25% — TP >= 0.025 per coprire 2x0.25%.
  - symbol: SOL/EUR
    mode: kraken
    capital: 30.0
    strategy: momentum
    profit_target: 0.03
    entry_slip: 0.002
    fee: 0.0025
    tick_interval: 30
    env_prefix: TRENDSUB_
    health_path: /home/marco/denaro/health/trend_sol_kraken.json
    stop_loss_pct: 0.10
    daily_loss_limit: 0.05
    max_drawdown_limit: 0.15
    enabled: false   # attivare solo dopo validazione paper + funding
