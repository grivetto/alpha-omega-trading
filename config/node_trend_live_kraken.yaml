# DENARO — istanza TREND LIVE su Kraken (2 bot live: SOL/EUR + XRP/EUR)
data_dir: node_data_trend_live
overrides_file: config/strategy_overrides_trend_live.json
supervisor:
  ram_critical_pct: 0.85
  ram_throttle_pct: 0.70
  cpu_critical_pct: 0.90
  tick_max_factor: 5.0
safemode:
  caution_pct: 70.0
  safe_pct: 85.0
  emergency_pct: 95.0
  interval_s: 10.0
hub:
  ws_enabled: false
  poll_interval: 10
  price_ttl: 30
  ws_max_retries: 5
  ws_retry_base_s: 2.0
exchange_rest:
  name: kraken
bots:
  # ── Feeder prezzi paper (mantengono aperti i canali sull'hub) ──
  - symbol: SOL/EUR
    mode: paper
    capital: 50
    levels: 2
    buy_distance: 0.01
    profit_target: 0.015
    fee: 0.001
    tick_interval: 60
  - symbol: XRP/EUR
    mode: paper
    capital: 50
    levels: 2
    buy_distance: 0.01
    profit_target: 0.015
    fee: 0.001
    tick_interval: 60

  # ── BOT LIVE 1: Kraken SOL/EUR (Capitale: 12.70 €) ──
  - symbol: SOL/EUR
    mode: kraken
    capital: 12.70
    levels: 2
    strategy: momentum
    profit_target: 0.025
    entry_slip: 0.002
    fee: 0.0025
    tick_interval: 30
    env_prefix: TRENDSUB_
    min_notional: 0.45
    health_path: /home/marco/denaro/health/trend_sol_kraken.json
    stop_loss_pct: 0.10
    daily_loss_limit: 0.05
    max_drawdown_limit: 0.15
    enabled: true

  # ── BOT LIVE 2: Kraken XRP/EUR (Capitale: 12.70 €) ──
  - symbol: XRP/EUR
    mode: kraken
    capital: 12.70
    levels: 2
    strategy: momentum
    profit_target: 0.025
    entry_slip: 0.002
    fee: 0.0025
    tick_interval: 30
    env_prefix: TRENDSUB_
    min_notional: 0.45
    health_path: /home/marco/denaro/health/trend_xrp_kraken.json
    stop_loss_pct: 0.10
    daily_loss_limit: 0.05
    max_drawdown_limit: 0.15
    enabled: true
