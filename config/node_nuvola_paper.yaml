# Denaro Node — OFFICINA PAPER su nuvola (dal 2026-10-01)
# Stessi bot trend del node, ma mode=paper: fill SIMULATI (PaperExchange),
# NESSUN ordine, NESSUNA chiave. Forward-test sui prezzi live.
data_dir: node_data_paper
overrides_file: config/nessun_override.json
supervisor:
  ram_critical_pct: 0.85
  ram_throttle_pct: 0.7
  cpu_critical_pct: 0.9
  tick_max_factor: 5.0
safemode:
  caution_pct: 70.0
  safe_pct: 85.0
  emergency_pct: 95.0
  interval_s: 10.0
hub:
  ws_enabled: false
  poll_interval: 10
  price_ttl: 30
exchange_rest:
  name: okx
  eea: true
rate_limits:
  okx:
    capacity: 10.0
    refill_rate: 5.0
bots:
- symbol: LINK/EUR
  mode: paper
  strategy: trend
  capital: 25.0
  canale: 40
  atr_period: 14
  trail_mult: 2.5
  stop_atr_mult: 2.0
  trend_ema: 100
  risk_pct: 0.02
  fee: 0.0035
  tick_interval: 30
  stop_loss_pct: 0.15
  daily_loss_limit: 0.05
  max_drawdown_limit: 0.2
  max_slippage: 0.005
  min_notional: 1.0
  health_path: /home/sergio/denaro/health/link_nuvola_live_paper.json
  enabled: true
