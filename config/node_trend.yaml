# DENARO — config dell'istanza TREND (istanza parallela "miracolo onesto").
# Nodo dedicato su MARCODG1 (denaro-node-trend.service): cattura i TREND che
# la griglia perde (momentum + scalper adattivo con trailing ATR).
# TUTTO in PAPER per la validazione 24h; il percorso LIVE richiede un
# sub-account dedicato (mai due engine sullo stesso account).
data_dir: node_data_trend
overrides_file: config/strategy_overrides_trend.json
supervisor:
  ram_critical_pct: 0.85
  ram_throttle_pct: 0.70
  cpu_critical_pct: 0.90
  tick_max_factor: 5.0
safemode:
  caution_pct: 70.0
  safe_pct: 85.0
  emergency_pct: 95.0
  interval_s: 10.0
hub:
  ws_enabled: true
  poll_interval: 10
  price_ttl: 30
  ws_max_retries: 5
  ws_retry_base_s: 2.0
exchange_rest:
  name: okx
  eea: true
bots:
  # ── MOMENTUM (trend-following puro: compra trend confermato, mai contro) ──
  - symbol: SOL/EUR
    mode: paper
    capital: 150
    strategy: momentum
    profit_target: 0.025
    entry_slip: 0.002
    fee: 0.001
    tick_interval: 30
    stop_loss_pct: 0.15
    daily_loss_limit: 0.05
    max_drawdown_limit: 0.15
  - symbol: ETH/EUR
    mode: paper
    capital: 150
    strategy: momentum
    profit_target: 0.025
    entry_slip: 0.002
    fee: 0.001
    tick_interval: 30
    stop_loss_pct: 0.15
    daily_loss_limit: 0.05
    max_drawdown_limit: 0.15
  # ── ADATTIVO (griglia ATR in range, scalper trailing in bull, niente bear) ──
  - symbol: ADA/EUR
    mode: paper
    capital: 150
    strategy: adaptive
    levels: 5
    buy_distance: 0.01
    profit_target: 0.015
    fee: 0.001
    tick_interval: 30
    stop_loss_pct: 0.15
    daily_loss_limit: 0.05
    max_drawdown_limit: 0.15
  - symbol: XRP/EUR
    mode: paper
    capital: 150
    strategy: adaptive
    levels: 5
    buy_distance: 0.01
    profit_target: 0.015
    fee: 0.001
    tick_interval: 30
    stop_loss_pct: 0.15
    daily_loss_limit: 0.05
    max_drawdown_limit: 0.15
