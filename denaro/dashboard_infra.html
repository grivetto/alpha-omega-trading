<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Denaro · Neon Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #04060f;
  --bg2: #080c1c;
  --card: rgba(10, 16, 38, 0.85);
  --card-solid: #0a1030;
  --neon-cyan: #00f3ff;
  --neon-cyan2: #0b8bff;
  --neon-pink: #ff2bd6;
  --neon-purple: #b026ff;
  --neon-green: #0aff9d;
  --neon-yellow: #ffe600;
  --neon-red: #ff2e63;
  --dim: #5a6a9e;
  --txt: #d7e3ff;
  --grid-line: rgba(0,243,255,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background:
    radial-gradient(900px 600px at 85% -10%, rgba(11,139,255,0.18), transparent 55%),
    radial-gradient(800px 500px at 5% 110%, rgba(176,38,255,0.16), transparent 55%),
    var(--bg);
  color: var(--txt);
  font-family: 'Share Tech Mono', monospace;
  min-height: 100vh;
  padding: 30px 36px;
  position: relative;
  overflow-x: hidden;
}
/* Cyberpunk grid overlay */
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 34px 34px;
  mask-image: radial-gradient(circle at 50% 40%, #000 20%, transparent 90%);
}
.scanline {
  position: fixed; inset: 0; pointer-events: none; z-index: 1;
  background: repeating-linear-gradient(0deg, rgba(0,243,255,0.02) 0px, transparent 2px);
  animation: scan 8s linear infinite;
}
@keyframes scan { from { transform: translateY(0);} to { transform: translateY(100%);} }

.container { max-width: 1560px; margin: 0 auto; position: relative; z-index: 2; }

/* Header */
header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 26px; flex-wrap: wrap; gap: 16px; }
.brand { display: flex; align-items: center; gap: 16px; }
.logo {
  width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center;
  font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 24px; color: var(--neon-cyan);
  border: 2px solid var(--neon-cyan); box-shadow: 0 0 22px rgba(0,243,255,0.6), inset 0 0 12px rgba(0,243,255,0.25);
  text-shadow: 0 0 10px var(--neon-cyan);
}
.brand h1 {
  font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 900; letter-spacing: 3px;
  color: var(--txt);
  text-shadow: 0 0 14px rgba(0,243,255,0.8);
}
.brand h1 .accent { color: var(--neon-cyan); }
.brand .tag { color: var(--dim); font-size: 11px; letter-spacing: 3px; margin-top: 3px; }
.status-pill {
  display: inline-flex; align-items: center; gap: 10px; padding: 10px 20px; border-radius: 6px;
  font-size: 13px; letter-spacing: 1px; font-weight: 700;
  background: var(--card); border: 1px solid var(--neon-cyan); box-shadow: 0 0 16px rgba(0,243,255,0.25);
  color: var(--txt);
}
.pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--neon-green); box-shadow: 0 0 12px var(--neon-green); animation: pulse 1.6s infinite; }
.pulse.warn { background: var(--neon-yellow); box-shadow: 0 0 12px var(--neon-yellow); }
@keyframes pulse { 0%,100% { opacity:1;} 50% { opacity:.3;} }
.timestamp { color: var(--dim); font-size: 12px; }

/* Hero equity */
.hero {
  display: flex; align-items: center; justify-content: space-between; gap: 24px;
  background: linear-gradient(135deg, rgba(0,243,255,0.10), rgba(176,38,255,0.08)), var(--card-solid);
  border: 1px solid rgba(0,243,255,0.35); border-radius: 8px; padding: 30px 36px; margin-bottom: 26px;
  box-shadow: 0 0 40px rgba(0,243,255,0.12), inset 0 0 40px rgba(0,243,255,0.05);
}
.eq-label { color: var(--neon-cyan); font-size: 13px; letter-spacing: 3px; margin-bottom: 10px; text-shadow: 0 0 8px rgba(0,243,255,0.6); }
.eq-value { font-size: 58px; font-weight: 900; letter-spacing: 1px; line-height: 1; font-family: 'Orbitron', sans-serif; }
.eq-value .cur { font-size: 26px; color: var(--dim); vertical-align: super; margin-right: 4px; }
.eq-break { color: var(--dim); font-size: 13px; letter-spacing: 1px; margin-top: 12px; }
.eq-break b { color: var(--neon-green); }

/* Grid */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 18px; }
.card {
  background: var(--card); border: 1px solid rgba(0,243,255,0.18); border-radius: 8px; padding: 20px;
  backdrop-filter: blur(6px); box-shadow: 0 0 20px rgba(0,0,0,0.5);
  transition: transform .2s, border-color .2s, box-shadow .2s;
  animation: fadeUp .4s ease both;
}
.card:hover { transform: translateY(-3px); border-color: rgba(0,243,255,0.5); box-shadow: 0 0 28px rgba(0,243,255,0.25); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px);} to { opacity: 1; transform: none;} }
.card h2 {
  display: flex; align-items: center; gap: 9px; font-family: 'Orbitron', sans-serif;
  font-size: 12px; font-weight: 700; letter-spacing: 2px; color: var(--neon-cyan); margin-bottom: 16px;
  text-shadow: 0 0 8px rgba(0,243,255,0.5);
}
.card h2 .ico { font-size: 16px; }

/* Bot cards */
.bots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-bottom: 18px; }
.bot {
  background: linear-gradient(160deg, rgba(0,243,255,0.10), rgba(10,16,48,0.95)), var(--card-solid);
  border: 1px solid var(--bot-color, var(--neon-cyan)); border-radius: 8px; padding: 20px;
  box-shadow: 0 0 24px rgba(0,0,0,0.5), 0 0 18px color-mix(in srgb, var(--bot-color, var(--neon-cyan)) 30%, transparent);
  position: relative; overflow: hidden;
}
.bot::after { content:""; position:absolute; top:0; left:-60%; width:50%; height:100%;
  background: linear-gradient(110deg, transparent, rgba(255,255,255,0.05), transparent); animation: shine 4s linear infinite; }
@keyframes shine { 0% { left:-60%;} 100% { left:140%;} }
.bot-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.bot-name { font-family: 'Orbitron', sans-serif; font-size: 15px; font-weight: 800; letter-spacing: 1px; color: var(--bot-color, var(--neon-cyan)); text-shadow: 0 0 8px currentColor; }
.bot-sym { color: var(--dim); font-size: 11px; letter-spacing: 1px; margin-top: 3px; }
.badge { padding: 4px 12px; border-radius: 4px; font-size: 10px; letter-spacing: 1px; font-weight: 800; border: 1px solid; }
.badge.running { color: var(--neon-green); border-color: var(--neon-green); background: rgba(10,255,157,0.1); box-shadow: 0 0 10px rgba(10,255,157,0.3); }
.badge.stopped { color: var(--neon-red); border-color: var(--neon-red); background: rgba(255,46,99,0.1); }
.bot-eq { font-size: 32px; font-weight: 900; letter-spacing: -1px; font-family: 'Orbitron', sans-serif; color: var(--bot-color, var(--neon-cyan)); text-shadow: 0 0 10px currentColor; }
.bot-eq-label { color: var(--dim); font-size: 10px; letter-spacing: 2px; margin-bottom: 16px; }
.bot-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.stat { text-align: center; border-right: 1px solid rgba(0,243,255,0.1); }
.stat:last-child { border-right: none; }
.stat .v { font-weight: 700; font-size: 16px; }
.stat .l { color: var(--dim); font-size: 9px; letter-spacing: 1px; margin-top: 3px; }
.stat .v.buys { color: var(--neon-cyan); }
.stat .v.sells { color: var(--neon-purple); }
.stat .v.ok { color: var(--neon-green); }
.stat .v.bad { color: var(--neon-red); }

/* rows */
.row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid rgba(0,243,255,0.08); font-size: 13px; }
.row:last-child { border-bottom: none; }
.row .k { color: var(--dim); letter-spacing: 1px; }
.row .v { font-weight: 600; }
.delta { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 4px; letter-spacing: 1px; }
.delta.up { color: var(--neon-green); background: rgba(10,255,157,0.12); border: 1px solid rgba(10,255,157,0.3); }
.delta.down { color: var(--neon-red); background: rgba(255,46,99,0.12); border: 1px solid rgba(255,46,99,0.3); }
.pill { display: inline-block; padding: 3px 12px; border-radius: 4px; font-size: 10px; font-weight: 800; letter-spacing: 1px; border: 1px solid; }
.pill.ok { color: var(--neon-green); border-color: var(--neon-green); background: rgba(10,255,157,0.1); }
.pill.bad { color: var(--neon-red); border-color: var(--neon-red); background: rgba(255,46,99,0.1); }
.pill.warn { color: var(--neon-yellow); border-color: var(--neon-yellow); background: rgba(255,230,0,0.08); }

.zabbix-btn {
  display: inline-flex; align-items: center; gap: 10px; margin-top: 16px; padding: 12px 20px; border-radius: 6px;
  background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple)); color: #04060f; font-weight: 900;
  font-size: 12px; letter-spacing: 2px; text-decoration: none; box-shadow: 0 0 22px rgba(0,243,255,0.5);
}
.zabbix-btn:hover { filter: brightness(1.15); }

.kv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; }
.kv { display: flex; justify-content: space-between; font-size: 12px; padding: 7px 0; border-bottom: 1px solid rgba(0,243,255,0.08); }
.kv .k { color: var(--dim); letter-spacing: 1px; }
.kv .v { font-weight: 600; }

footer { margin-top: 30px; text-align: center; color: var(--dim); font-size: 11px; letter-spacing: 2px; opacity: .7; }
.skeleton { color: var(--dim); }
@media (max-width: 1100px) { .bots { grid-template-columns: 1fr; } .hero { flex-direction: column; align-items: flex-start; } }
</style>
</head>
<body>
<div class="scanline"></div>
<div class="container">
  <header>
    <div class="brand">
      <div class="logo">α</div>
      <div>
        <h1>DENARO</h1>
        <div class="tag">NEON TRADING GRID</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
      <div class="status-pill"><span class="pulse" id="dot"></span><span id="sysstatus">—</span></div>
      <div class="timestamp" id="lastupdate">—</div>
    </div>
  </header>

  <div class="hero">
    <div>
      <div class="eq-label">// EQUITY TOTALE</div>
      <div class="eq-value"><span class="cur">€</span><span id="totaleq">—</span></div>
      <div class="eq-break" id="eqbreak">—</div>
    </div>
    <div class="eq-break" style="text-align:right;font-size:12px" id="eqdetail"></div>
  </div>

  <div class="bots" id="bots"></div>

  <div class="grid">
    <div class="card"><h2><span class="ico">▒</span> PREZZI LIVE</h2><div id="prices"></div></div>
    <div class="card"><h2><span class="ico">▒</span> SALDI EXCHANGE</h2><div id="balances"></div></div>
    <div class="card"><h2><span class="ico">▒</span> NODI</h2><div id="nodes"></div></div>
    <div class="card"><h2><span class="ico">▒</span> ZABBIX</h2><div id="zabbix"></div>
      <a class="zabbix-btn" href="/" target="_blank">APRI ZABBIX ▸</a>
    </div>
    <div class="card"><h2><span class="ico">▒</span> SISTEMA</h2><div class="kv-grid" id="system"></div></div>
    <div class="card"><h2><span class="ico">▒</span> CONTAINER</h2><div id="docker"></div></div>
  </div>

  <footer>DENARO NEON GRID · AUTO-REFRESH 30s · <span id="clock">—</span></footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (v, d=2) => (v === undefined || v === null) ? '—' : Number(v).toLocaleString('it-IT', {minimumFractionDigits: d, maximumFractionDigits: d});
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const BOT_META = {
  sol: {sym: 'SOL/EUR', ex: 'OKX·MAIN', color: '#00f3ff'},
  ada: {sym: 'ADA/EUR', ex: 'OKX·MARCOSUB1', color: '#ff2bd6'},
  sol_kraken: {sym: 'SOL/EUR', ex: 'KRAKEN·NUVOLA', color: '#b026ff'}
};
const ORDER = ['sol', 'ada', 'sol_kraken'];

async function load() {
  try {
    const r = await fetch('/api/infra.json', {cache: 'no-store'});
    const d = await r.json();
    render(d);
  } catch (e) {
    $('sysstatus').textContent = 'SIGNAL LOST';
    $('dot').className = 'pulse warn';
  }
}

function render(d) {
  $('lastupdate').textContent = 'SIG ' + (d.ts_iso ? d.ts_iso.replace('T',' ').replace('Z','') : '—') + ' UTC';

  const te = d.total_equity || 0;
  $('totaleq').textContent = fmt(te);
  const be = d.bot_equity ?? 0, ke = d.kraken_equity ?? 0;
  $('eqbreak').innerHTML = `OKX BOT <b>€${fmt(be)}</b> + KRAKEN <b>€${fmt(ke)}</b>`;
  const bal = d.balances || {};
  const labels = Object.keys(bal).filter(k => bal[k] && bal[k].ok);
  $('eqdetail').innerHTML = 'CHANNELS: ' + labels.map(esc).join(' ⏺ ');

  // Bots (ordinati)
  const bots = d.bots || {};
  const bwrap = $('bots');
  bwrap.innerHTML = '';
  let shown = 0;
  for (const name of ORDER) {
    const b = bots[name];
    if (!b) continue;
    shown++;
    const meta = BOT_META[name] || {sym: b.symbol || name, ex: b.exchange || '', color: '#00f3ff'};
    const st = b.status || '?';
    const stCls = st === 'running' ? 'running' : 'stopped';
    const stTxt = st === 'running' ? 'OPERATIVE' : (st === 'no_file' ? 'NO DATA' : st.toUpperCase());
    const pnl = b.pnl || 0;
    const pnlTxt = (pnl >= 0 ? '+' : '') + fmt(pnl, 4) + '€';
    const div = document.createElement('div');
    div.className = 'bot';
    div.style.setProperty('--bot-color', meta.color);
    div.innerHTML = `
      <div class="bot-head">
        <div><div class="bot-name">${esc(meta.sym)}</div><div class="bot-sym">${esc(meta.ex)}</div></div>
        <span class="badge ${stCls}">${esc(stTxt)}</span>
      </div>
      <div class="bot-eq">${fmt(b.total_equity)}€</div>
      <div class="bot-eq-label">EQUITY</div>
      <div class="bot-stats">
        <div class="stat"><div class="v buys">${b.buys ?? 0}</div><div class="l">BUY</div></div>
        <div class="stat"><div class="v sells">${b.sells ?? 0}</div><div class="l">SELL</div></div>
        <div class="stat"><div class="v ${pnl >= 0 ? 'ok' : 'bad'}">${pnlTxt}</div><div class="l">PNL</div></div>
        <div class="stat"><div class="v">${b.trades ?? 0}</div><div class="l">TRADE</div></div>
      </div>`;
    bwrap.appendChild(div);
  }
  if (shown === 0) bwrap.innerHTML = '<div class="card" style="grid-column:1/-1">NO BOT DETECTED</div>';

  // Prezzi
  const pr = d.prices || {};
  $('prices').innerHTML = Object.entries(pr).map(([s, t]) => {
    if (!t) return `<div class="row"><span class="k">${esc(s)}</span><span class="v bad">n/a</span></div>`;
    const pct = t.pct24h;
    const cls = pct === null || pct === undefined ? '' : (pct >= 0 ? 'up' : 'down');
    const pctTxt = (pct === null || pct === undefined) ? '' : `<span class="delta ${cls}">${pct >= 0 ? '▲' : '▼'} ${Math.abs(pct).toFixed(2)}%</span>`;
    return `<div class="row"><span class="k">${esc(s)}</span><span class="v" style="display:flex;align-items:center;gap:10px">${fmt(t.last, 5)} ${pctTxt}</span></div>`;
  }).join('') || '<div class="skeleton">—</div>';

  // Saldi
  const bd = $('balances');
  bd.innerHTML = '';
  for (const [k, v] of Object.entries(bal)) {
    const d2 = document.createElement('div');
    if (v && v.ok) {
      const tot = Object.entries(v.total || {}).map(([c, q]) => `${c}:${fmt(q, 4)}`).join(' · ');
      d2.innerHTML = `<div class="row"><span class="k">${esc(k)}</span><span class="pill ok">ONLINE</span></div><div class="skeleton" style="font-size:10px;padding-left:8px;letter-spacing:1px">${esc(tot)}</div>`;
    } else {
      d2.innerHTML = `<div class="row"><span class="k">${esc(k)}</span><span class="pill bad">OFFLINE</span></div>`;
    }
    bd.appendChild(d2);
  }

  // Nodi
  const nd = d.nodes || {};
  $('nodes').innerHTML = Object.entries(nd).map(([n, v]) => {
    const ok = v && v.reachable;
    return `<div class="row"><span class="k">${esc(n).toUpperCase()}</span><span class="pill ${ok ? 'ok' : 'bad'}">${ok ? 'UPLINK' : 'DOWN'}</span></div>`;
  }).join('') || '<div class="skeleton">—</div>';

  // Zabbix
  const z = d.zabbix || {};
  $('zabbix').innerHTML = Object.entries(z).map(([k, v]) => {
    const up = String(v).includes('Up') || v === 200;
    return `<div class="row"><span class="k">${esc(k)}</span><span class="pill ${up ? 'ok' : 'warn'}">${esc(v)}</span></div>`;
  }).join('') || '<div class="skeleton">—</div>';

  // Sistema
  const sys = d.system || {};
  $('system').innerHTML = Object.entries(sys).map(([k, v]) =>
    `<div class="kv"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join('') || '<div class="skeleton">—</div>';

  // Docker
  const dc = d.docker || {};
  $('docker').innerHTML = Object.entries(dc).map(([k, v]) => {
    const up = String(v).includes('Up');
    return `<div class="row"><span class="k">${esc(k)}</span><span class="pill ${up ? 'ok' : 'warn'}">${esc(v)}</span></div>`;
  }).join('') || '<div class="skeleton">—</div>';

  // Status
  const allOk = shown > 0 && ORDER.every(n => !bots[n] || bots[n].status === 'running');
  $('sysstatus').textContent = allOk ? 'SYSTEM ONLINE' : 'CAUTION — COMPONENT OFFLINE';
  $('dot').className = 'pulse' + (allOk ? '' : ' warn');
}

function tick() { $('clock').textContent = new Date().toLocaleTimeString('it-IT'); }
load();
setInterval(load, 30000);
setInterval(tick, 1000);
tick();
</script>
</body>
</html>
