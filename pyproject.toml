[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-omega-trading"
version = "2.2.0"
description = "Alpha-Omega Trading System - Unified distributed algorithmic trading fleet"
readme = "README.md"
license = {text = "Unlicense"}
requires-python = ">=3.12"
authors = [
    {name = "Alpha-Omega Team", email = "team@alpha-omega.trading"}
]
keywords = [
    "trading",
    "algorithmic",
    "crypto",
    "grid",
    "dca",
    "fleet",
    "distributed"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: Public Domain",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "ccxt>=4.0",
    "aiohttp>=3.14",
    "websockets>=12.0",
    "pyzmq>=25.0",
    "redis>=5.0",
    "asyncpg>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "orjson>=3.11",
    "numpy>=1.26",
    "pandas>=2.0",
    "ta-lib>=0.4.28",
    "prometheus-client>=0.19",
    "jinja2>=3.1",
    "python-telegram-bot>=20.0",
    "aiofiles>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "black>=24.0",
    "ruff>=0.5",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/grivetto/alpha-omega-trading"
Repository = "https://github.com/grivetto/alpha-omega-trading"

[tool.setuptools.packages.find]
where = ["."]
include = ["alpha_omega*", "config*", "scripts*", "systemd*", "docker*", "tests*"]

[tool.setuptools.package-dir]
"" = "."
