[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-omega-trading"
version = "3.0.0"
description = "Denaro — motore di trading algoritmico multi-exchange (OKX EEA, Kraken) con risk manager e backtest a parita' live"
readme = "README.md"
license = {text = "CC0-1.0"}
requires-python = ">=3.12"
authors = [
    {name = "Alpha-Omega Trading", email = "team@alpha-omega.trading"}
]
keywords = [
    "trading",
    "algorithmic",
    "crypto",
    "grid",
    "dca",
    "momentum",
    "fleet",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
# Dipendenze REALI, ricavate dagli import del package `denaro`.
dependencies = [
    "ccxt>=4.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "pydantic>=2.0",
    "psutil>=5.9",
    "pyzmq>=25.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/grivetto/alpha-omega-trading"
Repository = "https://github.com/grivetto/alpha-omega-trading"

[tool.setuptools.packages.find]
where = ["."]
include = ["denaro*"]

[tool.setuptools.package-dir]
"" = "."

[tool.pytest.ini_options]
testpaths = ["denaro/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
# Solo regole che intercettano errori reali: import inutilizzati, nomi
# indefiniti, sintassi. Il codebase storico non e' formattato in modo uniforme
# e non vogliamo una CI rossa per lo stile.
[tool.ruff.lint]
select = ["E9", "F"]
ignore = ["F401", "F841"]
