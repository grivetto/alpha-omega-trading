# Goal: obiettivi di performance per la Squadra Denaro
# Self-Improving Trading Agent — metodo scientifico, una variabile per volta

global:
  max_portfolio_drawdown_pct: 5.0      # Drawdown massimo globale sul portafoglio totale
  min_capital_eur: 180.0               # Se il capitale totale scende sotto, kill-switch
  reflection_cadence_min: 60           # Riflessione ogni N minuti (anche se nessun trade nuovo)

bots:
  Ares:
    target_return_30d_pct: 5.0
    max_drawdown_pct: 5.0
    min_sharpe: 0.5
    reflection_every_trades: 5
    one_variable_only: true
    variables:
      - "base_order_eur"         # ranges: [8.0, 20.0]
      - "take_profit_pct"       # ranges: [0.005, 0.025]
      - "stop_loss_pct"         # ranges: [0.003, 0.015]
      - "atr_sl_multiplier"     # ranges: [1.0, 3.0]
      - "atr_tp_multiplier"     # ranges: [2.0, 5.0]
      - "fast_sma"              # ranges: [3, 15]
      - "slow_sma"              # ranges: [10, 50]

  Hermes:
    target_return_30d_pct: 5.0
